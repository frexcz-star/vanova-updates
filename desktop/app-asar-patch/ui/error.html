<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANOVA — Could not load</title>
<style>
  :root {
    --bg: #0a0a0c;
    --surface: rgba(18, 18, 21, 0.72);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f5f5f6;
    --text-2: #a1a1aa;
    --accent: #dc2626;
    --accent-2: #b91c1c;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .panel {
    max-width: 560px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: left;
  }
  .brand { font-size: 22px; font-weight: 700; margin-bottom: 16px; text-align: center; }
  h1 { font-size: 18px; margin-bottom: 10px; text-align: center; }
  .msg { color: var(--text-2); font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
  .cause { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
  .code { color: #6e6e78; font-size: 12px; margin-bottom: 20px; font-family: ui-monospace, monospace; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  button {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .primary { background: var(--accent); color: white; }
  .primary:hover { background: var(--accent-2); }
  .ghost { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="panel">
    <div class="brand">VANOVA</div>
    <h1>Could not open the dashboard</h1>
    <p class="msg" id="message">The local VANOVA backend did not become ready.</p>
    <p class="cause" id="cause"></p>
    <p class="code" id="code"></p>
    <div class="actions">
      <button class="primary" id="retryBtn">Retry</button>
      <button class="ghost" id="repairBtn">Repair installation</button>
      <button class="ghost hidden" id="browserBtn">Open in browser</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const message = params.get('message') || 'The local VANOVA backend did not become ready.';
    const code = params.get('code');
    const errorCode = params.get('errorCode') || '';
    const cloudDown = params.get('cloudDown') === '1';
    const renderOnly = params.get('renderOnly') === '1';

    document.getElementById('message').textContent = message;
    if (errorCode) {
      document.getElementById('cause').textContent = 'Cause: ' + errorCode.replace(/_/g, ' ').toLowerCase();
    }
    if (errorCode) {
      document.getElementById('code').textContent = 'Diagnostic code: ' + errorCode;
    } else if (code && code !== '0' && code !== '-1') {
      document.getElementById('code').textContent = 'Error code: ' + code;
    }

    const browserBtn = document.getElementById('browserBtn');
    if (!cloudDown && renderOnly) {
      browserBtn.classList.remove('hidden');
    }

    document.getElementById('retryBtn').onclick = () => window.maios?.retryDashboard?.();
    document.getElementById('repairBtn').onclick = async () => {
      const btn = document.getElementById('repairBtn');
      btn.disabled = true;
      btn.textContent = 'Repairing…';
      try {
        const r = await window.maios?.repairInstallation?.();
        if (r && r.ok) {
          await window.maios?.retryDashboard?.();
        } else {
          btn.textContent = 'Repair failed — retry';
          btn.disabled = false;
        }
      } catch (_) {
        btn.textContent = 'Repair failed — retry';
        btn.disabled = false;
      }
    };
    browserBtn.onclick = () => window.maios?.openExternal?.('http://127.0.0.1:8000');
  </script>
</body>
</html>
